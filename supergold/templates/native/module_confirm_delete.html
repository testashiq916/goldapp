{% extends "base.html" %}
{% block title %}Delete {{ verbose_name }}{% endblock %}
{% block content %}
<h1>Delete {{ verbose_name }}?</h1>
<div class="card" style="max-width:520px;">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Yes, delete</button>
    <a class="btn secondary" href="{% url 'module_list' group slug %}">Cancel</a>
  </form>
</div>
{% endblock %}
